[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherlearn-backend"
version = "1.0.0"
description = "AI-Powered Educational Video Generation Platform — Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",

    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Google AI
    "google-generativeai>=0.7.0",
    "langchain-google-genai>=1.0.6",

    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.2.10",

    # Firebase
    "firebase-admin>=6.5.0",

    # OCR
    "pymupdf>=1.24.3",
    "pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.1",

    # TTS
    "edge-tts>=6.1.10",
    "gtts>=2.5.1",

    # Video processing
    "manim>=0.18.0",
    "ffmpeg-python>=0.2.0",

    # Utilities
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.4.0",
    "asyncio-throttle>=1.0.2",
    "tenacity>=8.3.0",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
