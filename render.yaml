services:
  # 1. API Web Service (FastAPI / Uvicorn)
  - type: web
    name: aetherlearn-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_BACKGROUND_WORKER
        value: true
      - key: MANIM_QUALITY
        value: low_quality
      - key: E2B_API_KEY
        sync: false

  # 2. Background Worker Service (No HTTP Health Checks!)
  # This worker runs python worker.py and processes queued rendering jobs.
  # Because it is a Background Worker, Render never probes it with HTTP pings,
  # preventing SIGTERM crashes during memory/CPU-intensive Manim animation rendering.
  - type: worker
    name: aetherlearn-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python worker.py
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_BACKGROUND_WORKER
        value: true
      - key: MANIM_QUALITY
        value: low_quality
      - key: E2B_API_KEY
        sync: false
